services:
  # Banco de Dados para Meta-dados do Airflow
  postgres:
    image: postgres:13
    container_name: northwind_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Configuração comum para serviços Airflow
  x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      # Conexões para o ETL
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: northwind
      CLICKHOUSE_PASSWORD: northwind
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: northwind
    volumes:
      - ./dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./data:/data

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    container_name: northwind_airflow_webserver
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: northwind_airflow_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    command: db init
    container_name: northwind_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  # Camada Analytics: ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: northwind_analytics
    ports:
      - "8123:8123" # HTTP interface
      - "9004:9000" # Native interface (Changed from 9000 to avoid conflict with MinIO)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Camada Frontend: Streamlit Dashboard
  dashboard:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: northwind_dashboard
    entrypoint: []
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=streamlit_ro
      - CLICKHOUSE_PASSWORD=streamlit_ro_pass
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      clickhouse:
        condition: service_healthy

  # Camada Worker: Ingestor (Python ETL)
  ingestor:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: northwind_ingestor
    entrypoint: []
    working_dir: /app
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=northwind
      - CLICKHOUSE_PASSWORD=northwind
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-northwind}
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: tail -f /dev/null
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Camada Object Storage: MinIO (S3 compatível)
  minio:
    image: minio/minio:latest
    container_name: northwind_minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
  minio_data:
